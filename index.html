<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSPD MDT - 执法数据库</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
<div class="portal-overlay show" id="portal-overlay">
  <div class="portal-inner">
    <div class="portal-badge">
      <img src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/badges/lspd_badge.png" alt="LSPD" title="Los Santos Police Department">
    </div>
    <div class="portal-title">LOS SANTOS POLICE DEPARTMENT</div>
    <div class="portal-motto">"To Protect and to Serve"</div>
    <div class="portal-slider" id="portal-slider">
      <img class="ps-item active" src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/slides/slide_1.jpg" alt="LSPD" width="1440" height="987">
      <img class="ps-item" data-src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/slides/slide_2.jpg" alt="LSPD" width="1440" height="1058">
      <img class="ps-item" data-src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/slides/slide_4.jpg" alt="LSPD" width="1440" height="745">
      <img class="ps-item" data-src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/slides/slide_5.jpg" alt="LSPD" width="1440" height="764">
      <div class="ps-dots">
        <span class="ps-dot active"></span>
        <span class="ps-dot"></span>
        <span class="ps-dot"></span>
        <span class="ps-dot"></span>
      </div>
    </div>
    <div class="portal-modules">
      <a class="portal-card portal-card-lg" href="law.html" title="法条检索 / 全文 / 米兰达 / 修正案 / 量刑">
        <span class="pc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span class="pc-title">法律检索系统</span>
        <span class="pc-desc">检索圣安地列斯州法典</span>
      </a>
      <a class="portal-card portal-card-lg" href="complaint.html" title="投诉我们的雇员">
        <span class="pc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <span class="pc-title">投诉我们的雇员</span>
        <span class="pc-desc">监督我们的执法</span>
      </a>
      <a class="portal-card portal-card-lg" href="enlist.html" title="加入我们 / 入职 / 调转">
        <span class="pc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></span>
        <span class="pc-title">加入我们</span>
        <span class="pc-desc">一份均等的就业机会</span>
      </a>
    </div>
    <div class="portal-foot">By Bradford</div>
  </div>

</div>
<script>
  (function(){
    var slider = document.getElementById('portal-slider');
    if (!slider) return;
    var items = slider.querySelectorAll('.ps-item');
    var dots  = slider.querySelectorAll('.ps-dot');
    var idx = 0, timer = null;
    function loadImg(el){
      var src = el.getAttribute('data-src');
      if (src && !el.src) el.src = src;   // 首次显示时才加载，懒加载
    }
    function go(n){
      items[idx].classList.remove('active');
      dots[idx].classList.remove('active');
      idx = (n + items.length) % items.length;
      loadImg(items[idx]);
      items[idx].classList.add('active');
      dots[idx].classList.add('active');
      // 预加载下一张，切换更顺滑
      var nxt = items[(idx + 1) % items.length];
      loadImg(nxt);
    }
    function next(){ go(idx + 1); }
    loadImg(items[0]);
    loadImg(items[1]);
    timer = setInterval(next, 8000);
    // 点击小圆点手动切换，切换后重置计时
    dots.forEach(function(dot, i){
      dot.addEventListener('click', function(){
        if (i === idx) return;
        go(i);
        clearInterval(timer);
        timer = setInterval(next, 8000);
      });
    });
  })();


  /* ===== 页面防护：禁用右键 / F12 / Ctrl+U / Ctrl+Shift+I / Ctrl+S ===== */
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 123) { e.preventDefault(); return; }                 // F12
    if ((e.ctrlKey && e.shiftKey) && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return; } // Ctrl+Shift+I/J/C
    if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) { e.preventDefault(); return; } // Ctrl+U / Ctrl+S
    if (e.keyCode === 114) { e.preventDefault(); return; }                 // F5（部分浏览器防刷新源码）
  });

  /* ===== 法律全文原文复制防护：仅作用于「全文」tab 的原文 ===== */
  function inFullText(el) {
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains('ft')) return true;
      el = el.parentNode;
    }
    return false;
  }
  document.addEventListener('selectstart', function(e) {
    if (inFullText(e.target)) e.preventDefault();
  });
  document.addEventListener('copy', function(e) {
    if (inFullText(e.target)) e.preventDefault();
  });
  document.addEventListener('cut', function(e) {
    if (inFullText(e.target)) e.preventDefault();
  });
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.keyCode === 65)) {                              // Ctrl+A 全选：若焦点在全文原文内则拦截
      var t = e.target;
      if (t && t.closest && t.closest('.ft')) { e.preventDefault(); return; }
    }
  });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投诉我们的雇员 - LSPD MDT</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">
<style>
<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --card: #ffffff;
  --border: #c8d4e0;
  --border-glow: #a0b4c8;
  --text: #1a1a1a;
  --dim: #5a7a9c;
  --accent: #012c49;
  --accent-glow: #33558c;
  --red: #c0392b;
  --green: #012c49;
  --yellow: #012c49;
  --orange: #012c49;
  --purple: #012c49;
  --lspd-gold: #012c49;
  --blue: #33558c;
}
html{scroll-behavior:smooth}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font:13px/1.6 'Segoe UI',-apple-system,'Microsoft YaHei',sans-serif;
  overflow-x:hidden;
}
body::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:none;
  pointer-events:none;z-index:9999;
}
.header{
  background:#012c49;
  border-bottom:1px solid #001d33;
  padding:0 20px;position:sticky;top:0;z-index:10;
}
.header-top{
  display:flex;align-items:center;gap:16px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box img{height:48px;width:48px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(59,130,246,.3))}
.header-title{flex:1}
.header-title h1{
  font-size:18px;font-weight:700;letter-spacing:2px;
  color:#fff;text-shadow:none;white-space:nowrap;
}

.header-title .motto{
  font-family:Georgia,'Times New Roman',serif;
  font-style:italic;font-size:13px;letter-spacing:2px;
  color:rgba(255,255,255,.8);margin:2px 0 4px;
  text-shadow:0 0 8px rgba(201,168,76,.25);
}
.status-bar{display:flex;align-items:center;gap:12px}
.status-item{
  display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
}
.status-dot{
  width:7px;height:7px;border-radius:0;background:var(--accent);
  box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 6px var(--green)}
  50%{opacity:.5;box-shadow:0 0 2px var(--green)}
}

.ctrl{padding:14px 20px 10px;max-width:1200px;margin:0 auto}
.search{display:flex;gap:10px;align-items:center}
.search input{
  flex:1;min-width:240px;padding:9px 14px;
  background:#fff;border:1px solid #c8d4e0;border-radius:0;
  color:var(--text);font-size:13px;outline:none;
  font-family:'Consolas','Courier New',monospace;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 8px rgba(26,58,92,.15)}
.search input::placeholder{color:#000000;font-family:inherit}
.search-btn{
  background:var(--accent);border:none;border-radius:0;
  color:#fff;padding:9px 20px;font-size:13px;font-weight:600;
  cursor:pointer;letter-spacing:1px;transition:all .2s;
}
.search-btn:hover{background:#2563eb;box-shadow:0 0 12px rgba(59,130,246,.3)}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{
  padding:4px 12px;border-radius:0;border:1px solid var(--border);
  background:#fff;color:#000000;font-size:11px;
  cursor:pointer;transition:all .15s;user-select:none;
}
.tag:hover{border-color:var(--accent);color:#000000}
.tag.on{background:rgba(26,58,92,.08);border-color:var(--accent);color:var(--accent)}
.tag.felony.on{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red)}
.tag.misd.on{background:rgba(234,179,8,.12);border-color:var(--yellow);color:var(--yellow)}
.tag.violation.on{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green)}
.tag.other.on{background:rgba(168,85,247,.12);border-color:var(--purple);color:var(--purple)}

.tab-row{display:flex;margin-top:8px;border-bottom:1px solid var(--border)}
.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding:7px 20px;border:none;background:none;color:var(--dim);
  font-size:13px;cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;
}
.tab.on{color:var(--accent-glow);border-bottom-color:var(--accent)}
.info{
  padding:8px 0;font-size:11px;color:var(--dim);
  display:flex;align-items:center;gap:8px;
}
.info .sep{color:var(--border-glow)}

.content{max-width:1600px;margin:0 auto;padding:10px 20px 40px;display:flex;gap:24px;align-items:flex-start}
.content-main{flex:1;min-width:0}
.content-left{flex:1;min-width:0;display:flex;flex-direction:column}

/* ===== 米兰达左侧栏 ===== */
.miranda-sidebar{
  width:260px;flex-shrink:0;
  position:sticky;top:10px;
  align-self:flex-start;
}

/* ===== 米兰达权利卡片 ===== */
.miranda-card{
  background:linear-gradient(135deg,#fff 0%,#f5f7fa 100%);
  border:1px solid rgba(26,58,92,.2);
  border-left:3px solid var(--lspd-gold);
  border-radius:0;
  padding:20px 24px;
  position:relative;
  overflow:hidden;
}
.miranda-card::before{
  content:'';position:absolute;top:0;right:0;
  width:120px;height:120px;
  background:radial-gradient(circle,rgba(201,168,76,.06) 0%,transparent 70%);
  pointer-events:none;
}
.miranda-header{
  display:flex;align-items:center;gap:8px;
  margin-bottom:14px;padding-bottom:10px;
  border-bottom:1px solid rgba(26,58,92,.1);
}
.miranda-title{
  font-size:15px;font-weight:700;letter-spacing:1px;
  color:#000000;text-transform:uppercase;
}
.miranda-body{display:flex;flex-direction:column;gap:10px}
.miranda-line{
  display:flex;align-items:flex-start;gap:10px;
  font-size:15px;line-height:1.7;color:#000000;
}
.miranda-line .miranda-text{flex:1}
.miranda-line .miranda-text strong{color:#000000;font-weight:700}
.miranda-footer{
  margin-top:12px;padding-top:10px;
  border-top:1px solid rgba(26,58,92,.08);
  font-size:11px;color:var(--dim);text-align:right;
  font-style:italic;letter-spacing:.3px;
}

/* ===== 服刑计算器 ===== */
.calc-card{
  background:#fff;border:1px solid #c8d4e0;
  border-radius:0;padding:14px 16px;margin-top:12px;
}
.calc-title{
  font-size:12px;font-weight:700;color:var(--accent-glow);
  letter-spacing:.5px;margin-bottom:10px;text-align:center;
}
.calc-row{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
}
.calc-row label{
  font-size:11px;color:var(--dim);white-space:nowrap;min-width:28px;
}
.calc-row input{
  flex:1;width:0;
  background:#fff;border:1px solid #c8d4e0;
  color:var(--text);font-size:13px;padding:6px 8px;
  border-radius:0;text-align:center;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.calc-row input:focus{border-color:var(--accent)}
.calc-row input::-webkit-inner-spin-button{opacity:1}
.calc-row .calc-unit{font-size:11px;color:var(--dim);white-space:nowrap}
.calc-result{
  background:#f5f7fa;
  border:1px solid rgba(59,130,246,.25);border-radius:0;
  padding:10px;text-align:center;margin-top:6px;
}
.calc-result .calc-months{
  font-size:24px;font-weight:800;color:var(--accent-glow);
  line-height:1.2;
}
.calc-result .calc-label{
  font-size:10px;color:var(--dim);letter-spacing:.5px;
}
.calc-result .calc-detail{
  font-size:10px;color:var(--dim);margin-top:2px;
}

/* ===== 修正案侧边栏 ===== */
.amendments-sidebar{
  width:340px;flex-shrink:0;
  background:#fff;border:1px solid #c8d4e0;
  border-radius:0;padding:16px;
  max-height:calc(100vh - 180px);overflow-y:auto;
  position:sticky;top:10px;
}
.amendments-sidebar::-webkit-scrollbar{width:4px}
.amendments-sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:0;font-size:16px;font-weight:700;
  letter-spacing:1px;text-align:center;margin-bottom:2px;
}
.amend-title{
  font-size:15px;font-weight:700;letter-spacing:1px;
  color:#000000;margin-bottom:4px;text-transform:uppercase;
}
.amend-item{
  padding:10px 0;border-bottom:1px solid rgba(200,212,224,.5);
}
.amend-item:last-child{border-bottom:none}
.amend-num{
  color:var(--accent);font-size:13px;font-weight:700;
  margin-bottom:4px;letter-spacing:.5px;
}
.amend-tags{
  color:var(--blue);font-size:11px;margin-bottom:6px;
  opacity:.8;
}
.amend-note{
  color:#000000;font-size:11px;line-height:1.7;
}
.amend-note strong{color:#000000;font-weight:700}

.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  background:#fff;border:1px solid #c8d4e0;
  border-radius:0;padding:14px 18px;margin-bottom:8px;
  transition:border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);opacity:0;transition:opacity .2s;
}
.card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(26,58,92,.08)}
.card:hover::before{opacity:1}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-name{font-size:14px;font-weight:600}
.badge{
  padding:2px 8px;border-radius:0;font-size:10px;font-weight:700;
  white-space:nowrap;flex-shrink:0;
}
.badge.f{background:rgba(192,57,43,.08);color:var(--red);border:1px solid rgba(192,57,43,.2)}
.badge.m{background:rgba(26,58,92,.08);color:var(--accent);border:1px solid rgba(26,58,92,.2)}
.badge.v{background:rgba(59,111,160,.08);color:var(--blue);border:1px solid rgba(59,111,160,.2)}
.badge.o{background:rgba(26,58,92,.06);color:var(--dim);border:1px solid rgba(26,58,92,.15)}
.card-p{
  color:#000000;font-size:12px;padding:5px 10px;
  background:rgba(26,58,92,.04);border-radius:0;margin:6px 0;
  line-height:1.5;border-left:2px solid rgba(26,58,92,.3);
  font-family:'Consolas','Courier New',monospace;
}
.card-d{color:#000000;font-size:12px;line-height:1.7}
.card-m{color:var(--dim);font-size:10px;margin-top:6px;opacity:.5;text-transform:uppercase}
.section{
  color:#000;font-size:12px;font-weight:700;
  padding:14px 0 6px;
  border-bottom:1px solid var(--border);margin-bottom:6px;
}
.hl{background:rgba(59,130,246,.25);border-radius:0;padding:0 2px;color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty .big{font-size:48px;opacity:.2;margin-bottom:12px;color:var(--accent)}
.ft{padding:6px 14px;border-left:2px solid var(--border);margin:2px 0;font-size:12px;color:var(--dim);-webkit-user-select:none;-moz-user-select:none;user-select:none}
.ft.found{border-left-color:var(--accent);background:rgba(26,58,92,.04)}

/* ===== 量刑面板 ===== */
body.has-panel{padding-bottom:340px}
.sentencing-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#ffffff;
  border-top:1px solid #d8dde3;
  box-shadow:0 -4px 24px rgba(12,26,42,.08);
  transition:transform .25s ease;
}
.sentencing-panel.collapsed{transform:translateY(calc(100% - 38px))}
.sentencing-toggle{
  display:flex;align-items:center;gap:12px;
  padding:8px 20px;cursor:pointer;user-select:none;
  border-bottom:1px solid #eef1f4;
}
.sentencing-toggle:hover{background:#fafbfc}
.sentencing-toggle .t-label{
  color:#000;font-size:12px;font-weight:700;letter-spacing:1px;
}
.sentencing-toggle .t-count{
  background:#f0f2f4;color:#000;font-size:10px;font-weight:700;
  padding:1px 7px;border-radius:0;min-width:20px;text-align:center;
}
.sentencing-toggle .t-summary{
  flex:1;text-align:right;color:#555;font-size:11px;
  font-family:'Consolas','Courier New',monospace;
}
.sentencing-body{
  max-height:300px;overflow-y:auto;padding:8px 16px;
}
.sentencing-body::-webkit-scrollbar{width:4px}
.sentencing-body::-webkit-scrollbar-thumb{background:#d8dde3}
.sentencing-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;background:#ffffff;
  border-bottom:1px solid #eef1f4;
  font-size:12px;
}
.sentencing-item .s-name{flex:1;color:#000;font-weight:600;min-width:0}
.sentencing-item .s-level{color:#666;font-size:10px;white-space:nowrap}
.sentencing-item .s-level-select{
  background:#ffffff;border:1px solid #d8dde3;color:#000;
  font-size:10px;padding:2px 4px;border-radius:0;cursor:pointer;
  white-space:nowrap;max-width:120px;
}
.sentencing-item .s-level-select:hover{border-color:#000}
.sentencing-item .s-level-select:focus{outline:none;border-color:#000}
.sentencing-item .s-prison{
  color:#000;font-family:'Consolas','Courier New',monospace;
  white-space:nowrap;min-width:80px;text-align:right;font-size:11px;
}
.sentencing-item .s-fine{
  color:#000;font-family:'Consolas','Courier New',monospace;
  white-space:nowrap;min-width:90px;text-align:right;font-size:11px;
}
.sentencing-item .s-del{
  color:#999;cursor:pointer;font-size:14px;padding:0 4px;line-height:1;
  opacity:.6;transition:all .15s;
}
.sentencing-item .s-del:hover{color:#000;opacity:1}
.sentencing-total{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;background:#f7f8f9;
  border:1px solid #e5e8eb;border-radius:0;
  font-family:'Consolas','Courier New',monospace;font-size:13px;
}
.sentencing-total .st-label{color:#000;font-weight:700;letter-spacing:1px}
.sentencing-total .st-prison{color:#000;font-weight:700;margin-left:12px}
.sentencing-total .st-fine{color:#000;font-weight:700;margin-left:8px}
.sentencing-clear{
  display:block;margin:6px auto 8px;padding:4px 24px;
  background:none;border:1px solid #d8dde3;border-radius:0;
  color:#666;font-size:11px;cursor:pointer;transition:all .15s;
}
.sentencing-clear:hover{border-color:#000;color:#000}
/* 卡牌上的量刑按钮 */
.sentencing-btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  margin-left:auto;flex-shrink:0;
  padding:2px 10px;background:#ffffff;
  border:1px solid #1a1a1a;border-radius:0;
  color:#000;font-size:10px;font-weight:700;
  cursor:pointer;letter-spacing:1px;transition:all .15s;
}
.sentencing-btn:hover{background:#000;color:#fff}
.sentencing-btn.added{background:#f0f2f4;border-color:#999;color:#666;opacity:.8}
/* 多级选择弹窗 */
.sentencing-dialog{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.65);z-index:200;justify-content:center;align-items:center;
}
.sentencing-dialog.show{display:flex}
.sentencing-dialog-content{
  background:#ffffff;border:1px solid #d8dde3;
  border-radius:0;padding:20px 24px;min-width:360px;max-width:500px;
  box-shadow:0 8px 40px rgba(0,0,0,.15);
}
.sentencing-dialog-title{
  color:#000;font-size:14px;font-weight:700;
  margin-bottom:4px;letter-spacing:1px;
}
.sentencing-dialog-sub{color:var(--dim);font-size:11px;margin-bottom:14px}
.sentencing-dialog-option{
  display:block;width:100%;padding:8px 14px;margin-bottom:6px;
  background:#fff;border:1px solid #d8dde3;border-radius:0;
  color:#000;font-size:12px;text-align:left;cursor:pointer;
  transition:all .15s;
}
.sentencing-dialog-option:hover{background:#f5f6f7;border-color:#000}
.sentencing-dialog-option .opt-label{display:block;color:#000;font-weight:600;margin-bottom:2px}
.sentencing-dialog-option .opt-desc{display:block;color:#666;font-size:11px}
.sentencing-dialog-cancel{
  display:block;width:100%;padding:6px;margin-top:8px;
  background:none;border:1px solid #d8dde3;border-radius:0;
  color:#666;font-size:11px;cursor:pointer;
}
.sentencing-dialog-cancel:hover{border-color:#000;color:#000}
/* 申请提交成功弹窗（盖在 portal 面板之上） */
#enlist-success-dialog{z-index:5700}
#enlist-success-dialog .sentencing-dialog-content{text-align:center;padding:28px 24px}
#enlist-success-dialog .enlist-success-text{
  color:#000;font-size:14px;line-height:1.9;margin:12px 0 18px;
}
#enlist-success-dialog .enlist-success-text a{
  color:#000;font-weight:700;text-decoration:underline;word-break:break-all;
}
#enlist-success-dialog .enlist-success-btn{
  display:block;width:100%;padding:10px;
  background:#000;border:1px solid #000;border-radius:0;
  color:#fff;font-size:14px;letter-spacing:2px;cursor:pointer;
  transition:all .15s;
}
#enlist-success-dialog .enlist-success-btn:hover{background:#1a1a1a}

/* ===== 量刑罪名 → 法条详情弹窗 ===== */
.sentencing-item .s-name{cursor:pointer;transition:color .15s}
.sentencing-item .s-name:hover{color:#000;text-decoration:underline}
#law-dialog .sentencing-dialog-content{max-width:560px;max-height:72vh;overflow-y:auto}
#law-dialog .sentencing-dialog-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.law-block{margin-bottom:12px}
.law-block .lb-label{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:3px}
.law-block .lb-text{color:#000000;font-size:13px;line-height:1.7}

/* ===== 网站快捷方式按钮（仅网站显示） ===== */
.shortcut-btn{
  display:flex;align-items:center;gap:5px;
  background:#ffffff;border:2px solid #012c49;
  color:#012c49;font-size:12px;font-weight:700;padding:8px 12px;
  border-radius:0;cursor:pointer;text-decoration:none;letter-spacing:.5px;
  white-space:nowrap;transition:all .2s;font-family:inherit;
}
.shortcut-btn:hover{background:#012c49;border-color:#001d33;color:#fff}
.shortcut-btn svg{width:14px;height:14px}

/* ===== 警用报告按钮 ===== */
.report-btn{
  display:flex;align-items:center;gap:5px;
  background:#ffffff;border:2px solid #012c49;
  color:#012c49;font-size:12px;font-weight:700;padding:8px 12px;
  border-radius:0;cursor:pointer;text-decoration:none;letter-spacing:.5px;
  white-space:nowrap;transition:all .2s;font-family:inherit;
}
.report-btn:hover{background:#012c49;border-color:#001d33;color:#fff}
.report-btn svg{width:14px;height:14px;flex-shrink:0}
.report-badge{
  display:inline-block;background:#c0392b;color:#fff;
  font-size:9px;padding:1px 5px;border-radius:0;
  font-weight:700;letter-spacing:0;margin-left:4px;
}

/* ===== 警用报告弹窗 ===== */
.report-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(12,26,42,.4);z-index:100;justify-content:center;align-items:flex-start;
  padding-top:40px;overflow-y:auto;
}
.report-overlay.show{display:flex}
.report-modal{
  background:#ffffff;border:1px solid #c8d4e0;
  border-radius:0;width:90%;max-width:500px;padding:20px;
  box-shadow:0 8px 40px rgba(12,26,42,.15);
}
.report-modal-header{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px;
}
.report-modal-title{
  color:var(--accent);font-size:16px;font-weight:700;letter-spacing:1px;
}
.report-warn{
  background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);
  border-radius:0;padding:8px 12px;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.report-warn-text{
  color:var(--red);font-size:12px;font-weight:600;letter-spacing:.5px;
}
.report-modal textarea{
  width:100%;min-height:240px;background:#f5f7fa;color:#1a1a1a;
  border:1px solid #c8d4e0;border-radius:0;padding:12px;
  font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.7;
  resize:vertical;letter-spacing:.5px;
}
.report-modal .copy-btn{
  margin-top:12px;width:100%;padding:12px;font-size:14px;
}
.report-close{
  background:none;border:none;color:var(--dim);font-size:22px;

/* ===== 账号登录（CloudBase 真账号系统） ===== */
.auth-overlay{

  display:none;align-items:center;justify-content:center;
}
.auth-card{

}

.auth-hint{font-size:10px;color:#aaa;margin-top:12px;letter-spacing:.5px;line-height:1.6}

/* ===== 门户首页（一级界面） ===== */
.portal-overlay{
  position:fixed;inset:0;z-index:5000;
  background:#ffffff;
  display:none;overflow-y:auto;
}
.portal-overlay.show{display:block}
.portal-inner{
  min-height:100%;max-width:960px;width:92%;margin:0 auto;box-sizing:border-box;
  text-align:center;padding:28px 48px 48px;
  display:flex;flex-direction:column;align-items:center;
  background:#ffffff;
}
.portal-inner > :first-child{margin-top:auto}
.portal-inner > :last-child{margin-bottom:auto}
.portal-badge{margin-top:34px}
.portal-badge img{
  width:120px;height:120px;object-fit:contain;
  filter:drop-shadow(0 0 18px rgba(201,168,76,.55));
}
.portal-title{
  color:#012c49;font-size:30px;font-weight:800;letter-spacing:6px;
  margin-top:18px;
  font-family:Impact,'Arial Black',sans-serif;
}
.portal-sub{color:#5a7a9c;font-size:13px;letter-spacing:4px;margin-top:6px;text-transform:uppercase}
.portal-motto{
  font-family:Georgia,'Times New Roman',serif;font-style:italic;
  color:#b08d2e;font-size:24px;letter-spacing:3px;margin-top:14px;
}
.portal-slider{
  width:100%;position:relative;
  aspect-ratio:21/9;overflow:hidden;background:#0a0f16;
  border:1px solid rgba(90,140,200,.35);
  box-shadow:0 0 30px rgba(59,130,246,.15);
  margin-top:20px;
}
.portal-slider .ps-item{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:0;transition:opacity 1.6s ease-in-out;
  pointer-events:none;
}
.portal-slider .ps-item.active{opacity:1}
.portal-slider .ps-dots{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:2;
}
.portal-slider .ps-dot{
  width:8px;height:8px;border-radius:0;background:rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.15);transition:background .4s;
}
.portal-slider .ps-dot.active{background:rgba(201,168,76,.85);border-color:rgba(201,168,76,.5)}
@media(max-width:640px){
  .portal-inner{padding:16px 24px 40px}
  .portal-badge{margin-top:22px}
}
.portal-modules{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px;width:100%}
.portal-card{
  background:#012c49;
  border:1px solid rgba(90,140,200,.35);border-radius:0;
  padding:32px 20px;color:#fff;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  font-family:inherit;transition:border-color .2s,box-shadow .2s,transform .2s;
}
.portal-card:hover{
  border-color:rgba(201,168,76,.85);
  box-shadow:0 0 24px rgba(201,168,76,.35),0 0 48px rgba(59,130,246,.2);
  transform:translateY(-4px);
}

.pc-icon svg{width:52px;height:52px}
.pc-title{font-size:18px;font-weight:700;letter-spacing:2px}
.pc-desc{font-size:12px;color:#5a7a9c;line-height:1.6}
.pc-status{font-size:11px;padding:3px 12px;border:1px solid rgba(59,130,246,.5);color:#7db4f0;letter-spacing:1px}
.pc-status.dev{color:#d8c08a;border-color:rgba(201,168,76,.5)}
.portal-foot{color:#8a9aa8;font-size:11px;letter-spacing:2px;margin-top:40px}
.portal-toast{
  position:fixed;bottom:48px;left:50%;transform:translateX(-50%);
  background:rgba(12,26,42,.95);border:1px solid rgba(201,168,76,.6);
  color:#fff;padding:10px 22px;font-size:13px;letter-spacing:1px;white-space:nowrap;
  display:none;box-shadow:0 0 16px rgba(201,168,76,.3);pointer-events:none;z-index:6000;
}
.portal-toast.show{display:block;animation:fadeIn .2s ease}
/* 投诉/征募表单：fixed 全屏压在 portal-overlay 之上，避免法典内容露出 */
.complaint-panel{
  position:fixed;inset:0;z-index:5500;overflow-y:auto;box-sizing:border-box;
  display:none;background:#ffffff;padding:100px 48px 48px;text-align:left;
}
.complaint-panel.show{display:block}
.complaint-panel > *{max-width:960px;margin-left:auto;margin-right:auto}
/* 投诉页顶部同款上方栏（无按钮），fixed 顶部压在 panel 之上 */
.complaint-header{display:none;position:fixed;top:0;left:0;right:0;z-index:5501}
.complaint-header.show{display:block}
.complaint-head{
  display:flex;align-items:center;gap:16px;margin-bottom:26px;
  padding-bottom:16px;border-bottom:2px solid #012c49;position:relative;
}
.complaint-head::after{

  background:linear-gradient(90deg,#c9a84c,rgba(201,168,76,0));
}
.complaint-title{color:#000000;font-size:20px;font-weight:800;letter-spacing:3px}
.complaint-sub{
  color:#5a7a9c;font-size:12px;letter-spacing:2px;margin-top:4px;
  text-transform:uppercase;font-family:Georgia,'Times New Roman',serif;font-style:italic;
}
.complaint-form{
  background:#fff;padding:32px 36px;
}
.cf-tip{
  font-size:12px;color:#33558c;margin-bottom:20px;padding:10px 14px;
  background:#eef3f8;border-left:4px solid #012c49;letter-spacing:1px;
  display:flex;align-items:center;gap:8px;
}
.cf-tip::before{content:'ℹ';font-size:14px;color:#012c49;flex-shrink:0}
.cf-field{margin-bottom:20px}
.cf-label{
  display:block;font-size:13px;font-weight:700;color:#000000;
  margin-bottom:8px;letter-spacing:1px;
}
.cf-label .req{color:#c0392b;margin-left:2px}
.cf-input,.cf-textarea{
  width:100%;box-sizing:border-box;padding:11px 13px;font-size:13px;
  border:1px solid #b9c6d2;background:#fbfcfd;color:#000;border-radius:0;
  outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;
}
.cf-input:focus,.cf-textarea:focus{
  border-color:#012c49;background:#fff;
  box-shadow:0 0 0 2px rgba(1,44,73,.12);
}
.cf-textarea{min-height:130px;resize:vertical;line-height:1.6}
.cf-actions{display:flex;gap:12px;margin-top:26px}
.cf-btn{
  padding:11px 30px;font-size:13px;font-weight:700;border:none;border-radius:0;
  cursor:pointer;letter-spacing:2px;font-family:inherit;transition:all .15s;
}
.cf-btn.submit{background:#012c49;color:#fff}
.cf-btn.submit:hover{background:#001d33}
.cf-btn.submit:disabled{background:#8ba0b3;cursor:not-allowed}
.cf-btn.back{background:#fff;color:#000000;border:2px solid #012c49}
.cf-btn.back:hover{background:#012c49;color:#fff}
@media(max-width:640px){
  .complaint-panel{padding:88px 24px 40px}

  .enlist-options{grid-template-columns:1fr;gap:14px}

}
/* 征募面板：入职/调转选项卡片（白底黑字，方角） */
.enlist-options{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.enlist-option{
  background:#fff;border:1px solid #012c49;border-radius:0;
  padding:34px 24px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:inherit;transition:box-shadow .2s,transform .2s,border-color .2s;
}
.enlist-option:hover{
  border-color:#c9a84c;
  box-shadow:0 6px 20px rgba(1,44,73,.12),0 0 0 2px rgba(201,168,76,.35);
  transform:translateY(-3px);
}
.eo-icon{width:46px;height:46px;color:#012c49}
.eo-icon svg{width:46px;height:46px}
.eo-title{font-size:17px;font-weight:800;color:#000000;letter-spacing:3px}
.eo-desc{font-size:12px;color:#5a7a9c;line-height:1.6}
/* 单选组（方角自定义样式，黑色字体） */
.cf-radio-group{display:flex;gap:26px;padding-top:2px}
.cf-radio{
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  font-size:13px;color:#000000;letter-spacing:1px;font-family:inherit;
}
.cf-radio input{position:absolute;opacity:0;pointer-events:none}
.cf-radio .rbox{
  width:16px;height:16px;border:1.5px solid #9fb2c4;background:#fff;border-radius:0;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:border-color .15s,background .15s;
}
.cf-radio input:checked + .rbox{border-color:#012c49;background:#012c49}
.cf-radio input:checked + .rbox::after{
  content:'';width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translateY(-1px);
}
.cf-radio input:focus-visible + .rbox{box-shadow:0 0 0 2px rgba(1,44,73,.25)}
/* 表单标题右侧返回选择按钮 */
.enlist-stepback{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  background:#fff;border:2px solid #012c49;color:#012c49;
  font-size:12px;font-weight:700;padding:8px 12px;border-radius:0;cursor:pointer;
  letter-spacing:.5px;font-family:inherit;transition:all .2s;white-space:nowrap;
}
.enlist-stepback:hover{background:#012c49;color:#fff}
.enlist-stepback svg{width:13px;height:13px;flex-shrink:0}
/* 返回首页按钮（与 report-btn/shortcut-btn 同款） */
.home-btn{
  display:flex;align-items:center;gap:5px;
  background:#ffffff;border:2px solid #012c49;
  color:#012c49;font-size:12px;font-weight:700;padding:8px 12px;
  border-radius:0;cursor:pointer;text-decoration:none;letter-spacing:.5px;
  white-space:nowrap;transition:all .2s;font-family:inherit;
}
.home-btn:hover{background:#012c49;border-color:#001d33;color:#fff}
.home-btn svg{width:14px;height:14px;flex-shrink:0}
/* 表单内返回按钮文字改黑（不影响法典页的返回首页按钮） */
#complaint-back{color:#000000}
@media(max-width:700px){
  .portal-modules{grid-template-columns:1fr;gap:14px;margin-top:28px}
  .portal-badge img{width:84px;height:84px}
  .portal-title{font-size:20px;letter-spacing:3px}
  .portal-card{padding:20px 14px}
  .pc-icon{width:40px;height:40px}
  .pc-icon svg{width:40px;height:40px}
  .portal-card.portal-card-lg{padding:30px 18px;gap:14px}
  .portal-card.portal-card-lg .pc-icon{width:52px;height:52px}
  .portal-card.portal-card-lg .pc-icon svg{width:52px;height:52px}
  .portal-card.portal-card-lg .pc-title{font-size:21px}
  .portal-card.portal-card-lg .pc-desc{font-size:13px}
  .portal-card.portal-card-lg .pc-status{font-size:12px;padding:5px 16px}
}
@media(max-width:400px){
  .home-btn span{display:none}
  .home-btn{padding:6px 8px}
}




/* ===== 子页面排版修复：面板/头部改文档流，不再 fixed 盖层 ===== */
html,body{background:#f2f4f7;min-height:100%}
.complaint-panel{
  position:static;inset:auto;z-index:auto;
  display:block;min-height:calc(100vh - 172px);
  padding:40px 48px 48px;
}
.complaint-panel.show{display:block}
.complaint-header{display:block;position:sticky;top:0;z-index:10}
.complaint-header.show{display:block}
</style>
</head>

<body>
  <div class="header complaint-header" id="complaint-header">
    <div class="header-top">
      <div class="logo-box">
        <img src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/badges/lspd_badge.png" alt="LSPD" title="Los Santos Police Department">
      </div>
      <div class="header-title">
        <h1>Los Santos Police Department</h1>
        <div class="motto">"To Protect and to Serve"</div>
      </div>
      <button class="home-btn" id="complaint-header-back" type="button" title="返回上一级">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>返回上一级</span>
      </button>
    </div>
  </div>


  <div class="complaint-panel" id="complaint-panel">
    <div class="complaint-head">
      <div>
        <div class="complaint-title">投诉我们的雇员</div>
        <div class="complaint-sub">Citizen Complaint Form</div>
      </div>
    </div>
    <div class="complaint-form">
      <div class="cf-tip">请如实填写以下信息，提交后我们将尽快调查处理。带 * 为必填项。</div>
      <div class="cf-field">
        <label class="cf-label" for="cf-name">警员姓名（选填）</label>
        <input class="cf-input" type="text" id="cf-name" placeholder="请输入警员姓名" maxlength="30">
      </div>
      <div class="cf-field">
        <label class="cf-label" for="cf-badge">警员警号（选填）</label>
        <input class="cf-input" type="text" id="cf-badge" placeholder="请输入警员警号" maxlength="20">
      </div>
      <div class="cf-field">
        <label class="cf-label" for="cf-phone">手机号<span class="req">*</span></label>
        <input class="cf-input" type="tel" id="cf-phone" placeholder="请输入手机号（仅数字与符号）" maxlength="30" autocomplete="off">
      </div>
      <div class="cf-field">
        <label class="cf-label" for="cf-time">事件发生时间<span class="req">*</span></label>
        <input class="cf-input" type="datetime-local" id="cf-time">
      </div>
      <div class="cf-field">
        <label class="cf-label" for="cf-desc">事发经过<span class="req">*</span></label>
        <textarea class="cf-textarea" id="cf-desc" placeholder="请详细描述事件经过…"></textarea>
      </div>
      <div class="cf-actions">
        <button class="cf-btn submit" type="button" id="cf-submit">提 交</button>
        <button class="cf-btn back" type="button" id="cf-cancel">取 消</button>
      </div>
    </div>
  </div>

  <div class="portal-toast" id="portal-toast"></div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <img src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/badges/lspd_badge.png" alt="LSPD">
    <span class="foot-brand">by Bradford</span>
    <span class="foot-tag">LSPD MDT &middot; To Protect and to Serve</span>
  </div>
  <div class="site-footer-account" id="account-bar" style="display:none">
    <span id="account-email"></span>
    <a href="#" id="auth-logout">退出登录</a>
  </div>
</footer>


<script>
(function(){
  var portalToast = document.getElementById('portal-toast');
  var toastTimer = null;
  function showToast(msg) {
    if (!portalToast) return;
    portalToast.textContent = msg;
    portalToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ portalToast.classList.remove('show'); }, 2200);
  }
  function goHome(){ location.href = '/'; }
  var complaintHeaderEl = document.getElementById('complaint-header');
  if (complaintHeaderEl) {
    complaintHeaderEl.addEventListener('click', function(e){
      if (e.target.closest('.logo-box') || e.target.closest('h1')) goHome();
    });
  }

  var complaintBack = document.getElementById('complaint-header-back');
  var cfCancel = document.getElementById('cf-cancel');
  var cfSubmit = document.getElementById('cf-submit');
  var cfPhone = document.getElementById('cf-phone');
  // 手机号允许输入所有数字与符号，拦截汉字和英文字母
  if (cfPhone) {
    cfPhone.addEventListener('input', function(){
      this.value = this.value.replace(/[\u4e00-\u9fa5a-zA-Z]/g, '');
    });
  }
  if (complaintBack) complaintBack.addEventListener('click', goHome);
  if (cfCancel) cfCancel.addEventListener('click', goHome);
  if (cfSubmit) {
    cfSubmit.addEventListener('click', function(){
      var t = document.getElementById('cf-time').value;
      var d = document.getElementById('cf-desc').value.trim();
      var p = cfPhone ? cfPhone.value.trim() : '';
      if (!p) { showToast('请填写手机号'); return; }
      if (!t) { showToast('请填写事件发生时间'); return; }
      if (!d) { showToast('请填写事发经过'); return; }
      // 提交给管理员：自动删除手机号里的所有符号，只保留数字
      var phone = p.replace(/[^0-9]/g, '');
      var payload = {
        name: document.getElementById('cf-name').value.trim(),
        badge: document.getElementById('cf-badge').value.trim(),
        phone: phone,
        time: t,
        desc: d
      };
      var btn = cfSubmit;
      btn.disabled = true;
      btn.textContent = '提交中...';
      var attempt = 0;
      function doSubmit(){
        attempt++;
        var ctrl = new AbortController();
        var timer = setTimeout(function(){ ctrl.abort(); }, 30000);
        fetch('https://bryant-d6g0lr5jrd4c95f00.service.tcloudbase.com/submitComplaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        }).then(function(res){
          clearTimeout(timer);
          return res.json();
        }).then(function(data){
          btn.disabled = false;
          btn.textContent = '提 交';
          if (data && data.code === 0) {
            showToast('投诉已提交，感谢您的反馈');
            document.getElementById('cf-name').value = '';
            document.getElementById('cf-badge').value = '';
            if (cfPhone) cfPhone.value = '';
            document.getElementById('cf-time').value = '';
            document.getElementById('cf-desc').value = '';
            setTimeout(goHome, 800);
          } else {
            showToast((data && data.msg) || '提交失败，请重试');
          }
        }).catch(function(){
          clearTimeout(timer);
          if (attempt < 2) {
            btn.textContent = '网络不稳定，重试中...';
            setTimeout(doSubmit, 800);
          } else {
            btn.disabled = false;
            btn.textContent = '提 交';
            showToast('网络错误，请稍后重试');
          }
        });
      }
      doSubmit();
    });
  }

  // 子页面直接显示投诉面板
  var cp = document.getElementById('complaint-panel');
  var ch = document.getElementById('complaint-header');
  if (cp) cp.classList.add('show');
  if (ch) ch.classList.add('show');

})();
</script>
</body>
</html>

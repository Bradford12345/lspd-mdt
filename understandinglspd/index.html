<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>了解LSPD - 组织架构</title>
<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico">
<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --card: #ffffff;
  --border: #c8d4e0;
  --border-glow: #a0b4c8;
  --text: #1a1a1a;
  --dim: #5a7a9c;
  --accent: #012c49;
  --accent-glow: #33558c;
  --red: #c0392b;
  --blue: #33558c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font:13px/1.6 'Segoe UI',-apple-system,'Microsoft YaHei',sans-serif;
  overflow-x:hidden;
}

/* === LSPD 统一顶栏 === */
.header{
  background:#012c49;
  border-bottom:1px solid #001d33;
  padding:0 20px;position:sticky;top:0;z-index:10;
}
.header-top{
  display:flex;align-items:center;gap:16px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  max-width:1200px;margin:0 auto;
}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box img{height:48px;width:48px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(59,130,246,.3))}
.header-title{flex:1}
.header-title h1{
  font-size:18px;font-weight:700;letter-spacing:2px;
  color:#fff;white-space:nowrap;
}
.header-title .motto{
  font-family:Georgia,'Times New Roman',serif;
  font-style:italic;font-size:13px;letter-spacing:2px;
  color:rgba(255,255,255,.8);margin:2px 0 4px;
}
.home-btn{
  display:flex;align-items:center;gap:5px;
  background:#ffffff;border:2px solid #012c49;
  color:#012c49;font-size:12px;font-weight:700;padding:8px 12px;
  border-radius:0;cursor:pointer;text-decoration:none;letter-spacing:.5px;
  white-space:nowrap;transition:all .2s;font-family:inherit;
}
.home-btn:hover{background:#012c49;border-color:#001d33;color:#fff}
.home-btn svg{width:14px;height:14px;flex-shrink:0}

/* === 页面标题区 === */
.page-head{
  max-width:1200px;margin:0 auto;padding:34px 20px 6px;
}
.page-h1{
  font-size:26px;font-weight:700;color:#012c49;letter-spacing:1px;
  margin-bottom:6px;line-height:1.2;
}
.page-h1-sub{font-size:13px;color:#5a7a9c;letter-spacing:.5px}

/* === 中间主体：组织列表 + 详情面板（学 LAPD 的部分） === */
.page-wrap{
  max-width:1200px;margin:0 auto;padding:24px 20px 40px;
  display:flex;gap:24px;align-items:flex-start;
}
.page-main{flex:1;min-width:0}

.org-chart-wrap{
  background:#fff;border:1px solid #e0e0e0;margin-bottom:24px;
}
.org-chart-head{
  background:#012c49;color:#fff;padding:12px 18px;
  font-size:14px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;
}
.org-tree{padding:0}
.org-level{
  background:#f0f4f8;padding:9px 18px;
  font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:#012c49;text-transform:uppercase;
  border-bottom:1px solid #e0e0e0;
}
.org-node{
  display:block;padding:11px 18px;text-decoration:none;
  color:#333;font-size:14px;border-bottom:1px solid #f0f0f0;
  cursor:pointer;transition:all .15s;
  border-left:3px solid transparent;
}
.org-node:hover{background:#f8f9fa;border-left-color:#c0392b}
.org-node.active{background:#fdf1f1;border-left-color:#c0392b;color:#c0392b;font-weight:700}
.org-node .en{font-size:12px;color:#888;margin-left:6px;font-weight:400}
.org-node .desc{display:block;font-size:12px;color:#888;margin-top:2px}

.dept-panel{
  border:1px solid #e0e0e0;background:#fff;padding:26px 30px;
}
.dept-tag{
  display:inline-block;background:#012c49;color:#fff;
  font-size:11px;letter-spacing:2px;padding:4px 12px;
  text-transform:uppercase;margin-bottom:14px;
}
.dept-title{font-size:23px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.dept-sub{
  font-size:13px;color:#888;font-style:italic;
  font-family:Georgia,serif;margin-bottom:16px;
}
.dept-chief{
  display:inline-block;background:#f8f9fa;border:1px solid #e0e0e0;
  padding:8px 16px;font-size:13px;color:#555;margin-bottom:20px;
}
.dept-chief b{color:#1a1a1a}

.dept-section{margin-bottom:22px}
.dept-section h3{
  font-size:14px;color:#012c49;letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:12px;
  padding-bottom:6px;border-bottom:2px solid #c0392b;
  display:inline-block;
}
.dept-section p{font-size:14px;color:#444;line-height:1.8;margin-bottom:10px}
.dept-section ul{list-style:none;padding:0}
.dept-section li{
  padding:8px 0 8px 20px;position:relative;font-size:14px;color:#444;
  border-bottom:1px solid #f0f0f0;
}
.dept-section li:last-child{border-bottom:none}
.dept-section li:before{
  content:'';position:absolute;left:0;top:14px;
  width:8px;height:8px;background:#c0392b;
}
.dept-section li b{color:#1a1a1a}

/* === LSPD 统一页脚 === */
.site-footer{
  margin-top:30px;padding:26px 20px;text-align:center;
  background:linear-gradient(180deg,#ffffff 0%,#f0f4f8 100%);
  border-top:2px solid #012c49;
}
.site-footer-inner{
  display:flex;align-items:center;justify-content:center;gap:12px;
  flex-wrap:wrap;
}
.site-footer img{height:42px;width:42px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(26,58,92,.3))}
.site-footer .foot-brand{
  font-family:Georgia,'Times New Roman',serif;font-style:italic;
  font-size:16px;letter-spacing:2px;color:#012c49;font-weight:700;
}
.site-footer .foot-tag{font-size:11px;color:#5a7a9c;letter-spacing:1px}

/* === 响应式 === */
@media(max-width:960px){
  .page-wrap{flex-direction:column}
  .dept-panel{padding:20px}
}
@media(max-width:600px){
  .header-title .motto{display:none}
  .page-h1{font-size:21px}
}
</style>
</head>

<body>

<!-- LSPD 统一顶栏 -->
<div class="header">
  <div class="header-top">
    <div class="logo-box">
      <img src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/badges/lspd_badge.png" alt="LSPD" title="Los Santos Police Department">
    </div>
    <div class="header-title">
      <h1>Los Santos Police Department</h1>
      <div class="motto">"To Protect and to Serve"</div>
    </div>
    <a class="home-btn" href="/" title="返回首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>返回首页</span>
    </a>
  </div>
</div>

<!-- 页面标题区 -->
<div class="page-head">
  <h1 class="page-h1">LSPD 组织架构</h1>
  <div class="page-h1-sub">点击左侧部门名称，查看详细部门介绍</div>
</div>

<!-- 中间主体：组织列表 + 详情面板 -->
<div class="page-wrap">
  <div class="org-chart-wrap" style="width:340px;flex-shrink:0;margin-bottom:0">
    <div class="org-chart-head">LSPD Organization Chart</div>
    <div class="org-tree" id="org-tree"></div>
  </div>

  <div class="dept-panel" id="dept-panel" style="flex:1;min-width:0">
    <div class="dept-tag" id="d-tag">DEPARTMENT PROFILE</div>
    <div class="dept-title" id="d-title">Patrol Division</div>
    <div class="dept-sub" id="d-sub">Department of the Los Santos Police Department</div>
    <div class="dept-chief" id="d-chief">Chief: <b>TBD</b></div>
    <div id="d-body"></div>
  </div>
</div>

<!-- LSPD 统一页脚 -->
<footer class="site-footer">
  <div class="site-footer-inner">
    <img src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/badges/lspd_badge.png" alt="LSPD">
    <span class="foot-brand">by Bradford</span>
    <span class="foot-tag">LSPD MDT &middot; To Protect and to Serve</span>
  </div>
</footer>

<script>
(function(){
  var TREE = [
    {
      level: 'Office of the Chief of Police',
      levelCn: '局长办公室',
      items: [
        { key: 'chief', name: 'Chief of Police', cn: '局长', desc: 'View Chief\'s Message' }
      ]
    },
    {
      level: 'Operations Bureau',
      levelCn: '行动局',
      items: [
        { key: 'patrol', name: 'Patrol Division', cn: '巡逻部', desc: 'City Patrol · First Response' },
        { key: 'traffic', name: 'Traffic Division', cn: '交通部', desc: 'Road Enforcement · Accident Response' }
      ]
    },
    {
      level: 'Detective Bureau',
      levelCn: '调查局',
      items: [
        { key: 'detective', name: 'Detective Division', cn: '侦探局', desc: 'Major Cases · Criminal Investigation' }
      ]
    },
    {
      level: 'Special Operations Bureau',
      levelCn: '特勤行动局',
      items: [
        { key: 'swat', name: 'SWAT', cn: '特警队', desc: 'High-Risk Tactics · Hostage Rescue' },
        { key: 'air', name: 'Air Support Division', cn: '空中支援', desc: 'Helicopter Patrol · Air Pursuit' }
      ]
    }
  ];

  var DEPTS = {
    chief: {
      tag: 'OFFICE OF THE CHIEF',
      title: 'Office of the Chief of Police',
      sub: 'The Command Core of the Department',
      chief: { role: 'Chief of Police', name: 'Jacob Hood' },
      intro: 'The Office of the Chief of Police is the highest decision-making and executive core of the Los Santos Police Department, reporting directly to the Board of Police Commissioners. It is responsible for strategic planning, policy implementation, and inter-departmental coordination.',
      sections: [
        {
          h: 'Core Mission & Responsibilities',
          items: [
            { b: 'Strategic Leadership', t: 'Develop long-term departmental goals, emphasizing community policing and technology integration, and supervise execution across all divisions.' },
            { b: 'Policy Implementation', t: 'Execute resolutions passed by the Police Commissioners.' },
            { b: 'Inter-Departmental Coordination', t: 'Integrate resources from the Operations Bureau, Detective Bureau, and Special Operations Bureau.' },
            { b: 'Public Trust Building', t: 'Enhance transparency through community forums and public reports (e.g., Annual Use of Force Report).' }
          ]
        },
        {
          h: 'Senior Management Structure',
          items: [
            { b: 'Chief of Police — Jacob Hood', t: 'Oversees all operations, reports directly to the Police Commissioners, and is responsible for major decisions.' },
            { b: 'Assistant Chiefs', t: 'No current appointments. Responsibilities include coordinating internal affairs, policy implementation, and crisis response.' }
          ]
        },
        {
          h: 'Direct Departments',
          items: [
            { b: 'Administration', t: 'Handles daily documents, scheduling, and meeting coordination for the Chief; manages departmental seals, records, and confidential information to ensure administrative compliance.' },
            { b: 'Community Relations Section', t: 'Designs community engagement programs, promotes police-civilian cooperation, and monitors community sentiment.' }
          ]
        },
        {
          h: 'Inter-Departmental Collaboration',
          items: [
            { b: 'Police Commissioners Liaison', t: 'The Chief submits monthly reports to the Commissioners, such as the 2025 Feasibility Report on Police Force Expansion. The Commissioners supervise office operations through audits and policy recommendations.' },
            { b: 'Professional Standards Coordination', t: 'The Chief\'s Office formulates policies (e.g., Officer Conduct Code), while the Professional Standards Division conducts specific investigations. The Special Affairs Office collaborates with the Internal Affairs Division (IAD).' }
          ]
        },
        {
          h: 'Latest Reforms',
          items: [
            { b: 'LSPD Police Chief Advisory Council', t: 'Collects and organizes officer feedback and recommendations, implementing reasonable suggestions.' }
          ]
        }
      ],
      summary: 'The LSPD Office of the Chief of Police balances public safety and law enforcement credibility through strategic leadership, inter-departmental collaboration, and community engagement. Its 2025 reforms focus on efficiency improvement and transparency enhancement, such as optimizing internal processes and expanding technology applications, providing a governance model for other police departments. Moving forward, the Office must continue to address resource pressures and systemic reform challenges to ensure the department remains responsive to the diverse needs of the Los Santos community.'
    },
    patrol: {
      tag: 'PATROL DIVISION',
      title: 'Patrol Division',
      sub: 'Department of the Los Santos Police Department',
      chief: 'TBD',
      intro: 'The Patrol Division is the face and backbone of the Los Santos Police Department, responsible for daily patrol and first response across the entire city. Patrol officers are the first point of contact for citizens and the most fundamental and direct guarantee of urban security.',
      sections: [
        {
          h: 'Primary Responsibilities',
          items: [
            { t: 'Daily city patrol covering all jurisdictions of Los Santos' },
            { t: 'First response to emergency calls, handling all types of incidents' },
            { t: 'Traffic stops, pedestrian checks, and suspicious vehicle inspections' },
            { t: 'Maintaining order at large events and public gatherings' },
            { t: 'Providing frontline support and intelligence to investigative units' }
          ]
        }
      ]
    },
    traffic: {
      tag: 'TRAFFIC DIVISION',
      title: 'Traffic Division',
      sub: 'Department of the Los Santos Police Department',
      chief: 'TBD',
      intro: 'The Traffic Division is responsible for road safety in Los Santos. Officers focus on maintaining urban traffic order, from daily road patrols to on-scene handling of major traffic accidents.',
      sections: [
        {
          h: 'Primary Responsibilities',
          items: [
            { t: 'Urban road patrols and enforcement of traffic violations' },
            { t: 'On-scene handling and liability determination of traffic accidents' },
            { t: 'DUI and drug-impaired driving inspections and enforcement' },
            { t: 'Coordinating road interception during pursuit operations' },
            { t: 'Traffic control and guidance during large-scale events' }
          ]
        }
      ]
    },
    detective: {
      tag: 'DETECTIVE BUREAU',
      title: 'Detective Division',
      sub: 'Department of the Los Santos Police Department',
      chief: 'TBD',
      intro: 'The Detective Division is the criminal investigation core of the Los Santos Police Department, responsible for solving major criminal cases across the city. Detectives do not wear uniforms, yet they guard the city in another way—through crime scene evidence collection, clue analysis, and suspect interrogation.',
      sections: [
        {
          h: 'Primary Responsibilities',
          items: [
            { t: 'Investigation of major criminal cases including homicide and robbery' },
            { t: 'Crime scene examination and physical evidence collection and analysis' },
            { t: 'Surveillance tracking, clue analysis, and suspect interrogation' },
            { t: 'Undercover operations and organized crime investigations' },
            { t: 'Collaborating with patrol divisions across all areas to solve cases' }
          ]
        }
      ]
    },
    swat: {
      tag: 'SWAT',
      title: 'SWAT',
      sub: 'Special Weapons and Tactics',
      chief: 'TBD',
      intro: 'SWAT is the high-risk tactical unit of the Los Santos Police Department, specifically designed to handle extreme danger situations that regular police forces cannot manage. SWAT officers undergo intensive tactical training and are equipped with standard tactical gear, serving as the last line of defense when the city faces its most severe threats.',
      sections: [
        {
          h: 'Primary Responsibilities',
          items: [
            { t: 'Arrest operations for armed suspects and other high-risk targets' },
            { t: 'Negotiation and rescue in hostage situations' },
            { t: 'Security details for high-profile individuals' },
            { t: 'Handling large-scale riots and civil unrest' },
            { t: 'Assault and clearance operations in high-risk areas' }
          ]
        }
      ]
    },
    air: {
      tag: 'AIR SUPPORT',
      title: 'Air Support Division',
      sub: 'Department of the Los Santos Police Department',
      chief: 'TBD',
      intro: 'The Air Support Division is the aerial force of the Los Santos Police Department, equipped with police helicopters that provide an irreplaceable aerial perspective for ground units. In pursuit, search and rescue, and large-event security operations, airborne officers serve as the "eyes in the sky" for ground operations, maintaining situational awareness of the entire area.',
      sections: [
        {
          h: 'Primary Responsibilities',
          items: [
            { t: 'Aerial surveillance and command during pursuit operations' },
            { t: 'Aerial search for missing persons and suspects' },
            { t: 'Aerial patrol and security at major events' },
            { t: 'Rapid aerial support for urban emergencies' },
            { t: 'Aerial photography and evidence collection to assist case investigations' }
          ]
        }
      ]
    }
  };

  // 渲染左侧树
  var treeHtml = '';
  TREE.forEach(function(group){
    treeHtml += '<div class="org-level">' + group.level + '<span style="margin-left:8px;color:#888;font-weight:400">' + group.levelCn + '</span></div>';
    group.items.forEach(function(item){
      treeHtml += '<a class="org-node" data-dept="' + item.key + '">' +
        item.name + '<span class="en">' + item.cn + '</span>' +
        '<span class="desc">' + item.desc + '</span></a>';
    });
  });
  document.getElementById('org-tree').innerHTML = treeHtml;

  // 渲染详情
  function render(key){
    var d = DEPTS[key];
    if (!d) return;
    document.getElementById('d-tag').textContent = d.tag || 'DEPARTMENT PROFILE';
    document.getElementById('d-title').textContent = d.title;
    document.getElementById('d-sub').textContent = d.sub || 'Department of the Los Santos Police Department';
    if (typeof d.chief === 'object') {
      document.getElementById('d-chief').innerHTML = d.chief.role + ': <b>' + d.chief.name + '</b>';
    } else {
      document.getElementById('d-chief').innerHTML = 'Chief: <b>' + d.chief + '</b>';
    }

    var html = '';
    if (d.intro) html += '<div class="dept-section"><p>' + d.intro + '</p></div>';
    (d.sections || []).forEach(function(s){
      html += '<div class="dept-section"><h3>' + s.h + '</h3><ul>';
      s.items.forEach(function(it){
        html += '<li>';
        if (it.b) html += '<b>' + it.b + '</b>' + (it.t ? ' — ' : '');
        if (it.t) html += it.t;
        html += '</li>';
      });
      html += '</ul></div>';
    });
    if (d.summary) html += '<div class="dept-section"><h3>Summary</h3><p>' + d.summary + '</p></div>';
    document.getElementById('d-body').innerHTML = html;

    document.querySelectorAll('.org-node').forEach(function(el){
      el.classList.toggle('active', el.getAttribute('data-dept') === key);
    });
  }

  document.querySelectorAll('.org-node').forEach(function(el){
    el.addEventListener('click', function(e){
      e.preventDefault();
      render(el.getAttribute('data-dept'));
    });
  });

  render('chief');
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>了解LSPD - 组织架构</title>
<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico">
<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --card: #ffffff;
  --border: #c8d4e0;
  --border-glow: #a0b4c8;
  --text: #1a1a1a;
  --dim: #5a7a9c;
  --accent: #012c49;
  --accent-glow: #33558c;
  --red: #c0392b;
  --blue: #33558c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font:13px/1.6 'Segoe UI',-apple-system,'Microsoft YaHei',sans-serif;
  overflow-x:hidden;
}

/* === LSPD 统一顶栏 === */
.header{
  background:#012c49;
  border-bottom:1px solid #001d33;
  padding:0 20px;position:sticky;top:0;z-index:10;
}
.header-top{
  display:flex;align-items:center;gap:16px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  max-width:1200px;margin:0 auto;
}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box img{height:48px;width:48px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(59,130,246,.3))}
.header-title{flex:1}
.header-title h1{
  font-size:18px;font-weight:700;letter-spacing:2px;
  color:#fff;white-space:nowrap;
}
.header-title .motto{
  font-family:Georgia,'Times New Roman',serif;
  font-style:italic;font-size:13px;letter-spacing:2px;
  color:rgba(255,255,255,.8);margin:2px 0 4px;
}
.home-btn{
  display:flex;align-items:center;gap:5px;
  background:#ffffff;border:2px solid #012c49;
  color:#012c49;font-size:12px;font-weight:700;padding:8px 12px;
  border-radius:0;cursor:pointer;text-decoration:none;letter-spacing:.5px;
  white-space:nowrap;transition:all .2s;font-family:inherit;
}
.home-btn:hover{background:#012c49;border-color:#001d33;color:#fff}
.home-btn svg{width:14px;height:14px;flex-shrink:0}

/* === 页面标题区 === */
.page-head{
  max-width:1200px;margin:0 auto;padding:34px 20px 6px;
}
.page-h1{
  font-size:26px;font-weight:700;color:#012c49;letter-spacing:1px;
  margin-bottom:6px;line-height:1.2;
}
.page-h1-sub{font-size:13px;color:#5a7a9c;letter-spacing:.5px}

/* === 中间主体：组织列表 + 详情面板（学 LAPD 的部分） === */
.page-wrap{
  max-width:1200px;margin:0 auto;padding:24px 20px 40px;
  display:flex;gap:24px;align-items:flex-start;
}
.page-main{flex:1;min-width:0}

.org-chart-wrap{
  background:#fff;border:1px solid #e0e0e0;margin-bottom:24px;
}
.org-chart-head{
  background:#012c49;color:#fff;padding:12px 18px;
  font-size:14px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;
}
.org-tree{padding:0}
.org-level{
  background:#f0f4f8;padding:9px 18px;
  font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:#012c49;text-transform:uppercase;
  border-bottom:1px solid #e0e0e0;
}
.org-node{
  display:block;padding:11px 18px;text-decoration:none;
  color:#333;font-size:14px;border-bottom:1px solid #f0f0f0;
  cursor:pointer;transition:all .15s;
  border-left:3px solid transparent;
}
.org-node:hover{background:#f8f9fa;border-left-color:#c0392b}
.org-node.active{background:#fdf1f1;border-left-color:#c0392b;color:#c0392b;font-weight:700}
.org-node .en{font-size:12px;color:#888;margin-left:6px;font-weight:400}

.dept-panel{
  border:1px solid #e0e0e0;background:#fff;padding:26px 30px;
}
.dept-title{
  font-size:26px;font-weight:700;color:#1a1a1a;
  letter-spacing:.5px;line-height:1.35;margin-bottom:2px;
}
.dept-chief{
  display:inline-block;background:#f8f9fa;border:1px solid #e0e0e0;
  padding:8px 16px;font-size:13px;color:#555;margin-bottom:20px;
}
.dept-chief b{color:#1a1a1a}

/* 部门标题行 + 徽章 */
.dept-header-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.dept-header-text{
  flex:1;min-width:0;
  padding-left:14px;border-left:4px solid #c0392b;
}
.dept-header-text::after{
  content:'';display:block;height:1px;background:#e0e0e0;margin-top:12px;
}
.dept-badge{width:78px;height:78px;border:1px solid #e0e0e0;background:#fff;padding:6px;flex-shrink:0}
.dept-badge:empty{display:none}
.dept-badge img{width:100%;height:100%;object-fit:contain}

/* 指挥官卡片（仿 LAPD 刑侦局部门卡） */
.dept-cmd-wrap{
  display:flex;gap:16px;flex-wrap:wrap;
  margin-bottom:20px;
}
.dept-cmd{
  display:flex;align-items:center;gap:16px;
  background:#f8f9fa;border:1px solid #e0e0e0;
  padding:14px 18px;flex:1;min-width:280px;
}
.dept-cmd .avatar{
  width:56px;height:56px;flex-shrink:0;
  background:#012c49;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;
}
.dept-cmd .cmd-info{min-width:0}
.dept-cmd .cmd-name{font-size:17px;font-weight:700;color:#1a1a1a}
.dept-cmd .cmd-en{font-size:13px;font-weight:400;color:#888}
.dept-cmd .cmd-rank{
  font-size:11px;color:#c0392b;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:700;margin-top:2px;
}
.dept-cmd .cmd-role{font-size:12px;color:#888;margin-top:2px}

.dept-section{margin-bottom:22px}
.dept-section h3{
  font-size:14px;color:#012c49;letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:12px;
  padding-bottom:6px;border-bottom:2px solid #c0392b;
  display:inline-block;
}
.dept-section p{font-size:14px;color:#444;line-height:1.8;margin-bottom:10px}
.dept-section ul{list-style:none;padding:0}
.dept-section li{
  padding:8px 0 8px 20px;position:relative;font-size:14px;color:#444;
  border-bottom:1px solid #f0f0f0;
}
.dept-section li:last-child{border-bottom:none}
.dept-section li:before{
  content:'';position:absolute;left:0;top:14px;
  width:8px;height:8px;background:#c0392b;
}
.dept-section li b{color:#1a1a1a}

/* 旗下部门卡片（子部门，如交通分局下的高速巡捕单位） */
.subunit{background:#fff;border:1px solid #e0e0e0;padding:16px 18px;margin-bottom:12px}
.subunit-name{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.subunit-name .en{font-size:12px;color:#888;font-weight:400;margin-left:6px}
.subunit p{font-size:14px;color:#444;line-height:1.8;margin-bottom:10px}
.subunit ul{list-style:none;padding:0;margin:0 0 10px}
.subunit li{
  padding:8px 0 8px 20px;position:relative;font-size:14px;color:#444;
  border-bottom:1px solid #f0f0f0;
}
.subunit li:last-child{border-bottom:none}
.subunit li:before{
  content:'';position:absolute;left:0;top:14px;
  width:8px;height:8px;background:#c0392b;
}
.subunit li b{color:#1a1a1a}
.subunit-sub{margin-top:8px}
.subunit-sub b{font-size:13px;color:#1a1a1a}

/* === LSPD 统一页脚 === */
.site-footer{
  margin-top:30px;padding:26px 20px;text-align:center;
  background:linear-gradient(180deg,#ffffff 0%,#f0f4f8 100%);
  border-top:2px solid #012c49;
}
.site-footer-inner{
  display:flex;align-items:center;justify-content:center;gap:12px;
  flex-wrap:wrap;
}
.site-footer img{height:42px;width:42px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(26,58,92,.3))}
.site-footer .foot-brand{
  font-family:Georgia,'Times New Roman',serif;font-style:italic;
  font-size:16px;letter-spacing:2px;color:#012c49;font-weight:700;
}
.site-footer .foot-tag{font-size:11px;color:#5a7a9c;letter-spacing:1px}

/* === 响应式 === */
@media(max-width:960px){
  .page-wrap{flex-direction:column}
  .dept-panel{padding:20px}
}
@media(max-width:600px){
  .header-title .motto{display:none}
  .page-h1{font-size:21px}
}
</style>
</head>

  // 渲染左侧树
  var treeHtml = '';
  TREE.forEach(function(group){
    treeHtml += '<div class="org-level">' + group.level + '<span style="margin-left:8px;color:#888;font-weight:400">' + group.levelCn + '</span></div>';
    group.items.forEach(function(item){
      treeHtml += '<a class="org-node" data-dept="' + item.key + '">' +
        item.name + '<span class="en">' + item.cn + '</span></a>';
    });
  });
  document.getElementById('org-tree').innerHTML = treeHtml;

  // 渲染详情
  function render(key){
    if (key === 'asst-chief') key = 'chief';
    var d = DEPTS[key];
    if (!d) return;
    document.getElementById('d-title').textContent = d.title;

    // 部门徽章
    var badgeEl = document.getElementById('d-badge');
    if (d.badge) {
      badgeEl.innerHTML = '<img src="' + d.badge + '" alt="' + d.title + '">';
      badgeEl.style.display = '';
    } else {
      badgeEl.innerHTML = '';
      badgeEl.style.display = 'none';
    }

    // 指挥官卡片（仿 LAPD 刑侦局部门卡：照片位 + 姓名 + 警衔 + 职务）
    // 支持 d.chief 单人 + d.team 多人并排
    var cmds = [d.chief].concat(d.team || []);
    var cmdHtml = '<div class="dept-cmd-wrap">';
    cmds.forEach(function(c){
      if (c && c.name) {
        var initial = (c.en || c.name).charAt(0).toUpperCase();
        cmdHtml += '<div class="dept-cmd"><div class="avatar">' + initial + '</div><div class="cmd-info">' +
          '<div class="cmd-name">' + c.name + (c.en ? ' <span class="cmd-en">(' + c.en + ')</span>' : '') + '</div>' +
          '<div class="cmd-rank">' + (c.rank || 'Commanding Officer') + '</div>' +
          '<div class="cmd-role">' + (c.role || '主管') + '</div>' +
          '</div></div>';
      } else {
        cmdHtml += '<div class="dept-cmd"><div class="avatar">?</div><div class="cmd-info">' +
          '<div class="cmd-name">' + (c || '待定') + '</div>' +
          '<div class="cmd-rank">Commanding Officer</div>' +
          '<div class="cmd-role">主管</div>' +
          '</div></div>';
      }
    });
    cmdHtml += '</div>';
    document.getElementById('d-chief').innerHTML = cmdHtml;

    var html = '';
    if (d.intro) html += '<div class="dept-section"><p>' + d.intro.replace(/\n\n/g, '</p><p>') + '</p></div>';
    (d.sections || []).forEach(function(s){
      html += '<div class="dept-section"><h3>' + s.h + '</h3><ul>';
      s.items.forEach(function(it){
        html += '<li>';
        if (it.b) html += '<b>' + it.b + '</b>' + (it.t ? ' — ' : '');
        if (it.t) html += it.t;
        html += '</li>';
      });
      html += '</ul></div>';
    });
    if (d.subunits && d.subunits.length) {
      html += '<div class="dept-section"><h3>旗下部门</h3>';
      d.subunits.forEach(function(u){
        html += '<div class="subunit"><div class="subunit-name">' + u.name + '<span class="en">' + (u.en || '') + '</span></div>';
        if (u.intro) html += '<p>' + u.intro + '</p>';
        if (u.duties && u.duties.length) {
          html += '<ul>';
          u.duties.forEach(function(dt){
            html += '<li>';
            if (dt.b) html += '<b>' + dt.b + '</b>' + (dt.t ? ' — ' : '');
            if (dt.t) html += dt.t;
            html += '</li>';
          });
          html += '</ul>';
        }
        if (u.skills && u.skills.length) {
          html += '<div class="subunit-sub"><b>警员素质与技能</b><ul>';
          u.skills.forEach(function(s){
            html += '<li>' + s + '</li>';
          });
          html += '</ul></div>';
        }
        if (u.summary) html += '<p>' + u.summary + '</p>';
        html += '</div>';
      });
      html += '</div>';
    }
    if (d.summary) html += '<div class="dept-section"><h3>总结</h3><p>' + d.summary + '</p></div>';
    document.getElementById('d-body').innerHTML = html;

    document.querySelectorAll('.org-node').forEach(function(el){
      var k = el.getAttribute('data-dept');
      // 局长与助理局长联动高亮：点任一，两者同时变红
      var active = (k === key) || (key === 'chief' && k === 'asst-chief');
      el.classList.toggle('active', active);
    });
  }

  document.querySelectorAll('.org-node').forEach(function(el){
    el.addEventListener('click', function(e){
      e.preventDefault();
      render(el.getAttribute('data-dept'));
    });
  });

  render('chief');
})();
</script>

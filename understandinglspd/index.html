<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>了解LSPD - 组织架构</title>
<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico">
<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --card: #ffffff;
  --border: #c8d4e0;
  --border-glow: #a0b4c8;
  --text: #1a1a1a;
  --dim: #5a7a9c;
  --accent: #012c49;
  --accent-glow: #33558c;
  --red: #c0392b;
  --blue: #33558c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font:13px/1.6 'Segoe UI',-apple-system,'Microsoft YaHei',sans-serif;
  overflow-x:hidden;
}

/* === LSPD 统一顶栏 === */
.header{
  background:#012c49;
  border-bottom:1px solid #001d33;
  padding:0 20px;position:sticky;top:0;z-index:10;
}
.header-top{
  display:flex;align-items:center;gap:16px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  max-width:1200px;margin:0 auto;
}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box img{height:48px;width:48px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(59,130,246,.3))}
.header-title{flex:1}
.header-title h1{
  font-size:18px;font-weight:700;letter-spacing:2px;
  color:#fff;white-space:nowrap;
}
.header-title .motto{
  font-family:Georgia,'Times New Roman',serif;
  font-style:italic;font-size:13px;letter-spacing:2px;
  color:rgba(255,255,255,.8);margin:2px 0 4px;
}
.home-btn{
  display:flex;align-items:center;gap:5px;
  background:#ffffff;border:2px solid #012c49;
  color:#012c49;font-size:12px;font-weight:700;padding:8px 12px;
  border-radius:0;cursor:pointer;text-decoration:none;letter-spacing:.5px;
  white-space:nowrap;transition:all .2s;font-family:inherit;
}
.home-btn:hover{background:#012c49;border-color:#001d33;color:#fff}
.home-btn svg{width:14px;height:14px;flex-shrink:0}

/* === 页面标题区 === */
.page-head{
  max-width:1200px;margin:0 auto;padding:34px 20px 6px;
}
.page-h1{
  font-size:26px;font-weight:700;color:#012c49;letter-spacing:1px;
  margin-bottom:6px;line-height:1.2;
}
.page-h1-sub{font-size:13px;color:#5a7a9c;letter-spacing:.5px}

/* === 中间主体：组织列表 + 详情面板（学 LAPD 的部分） === */
.page-wrap{
  max-width:1200px;margin:0 auto;padding:24px 20px 40px;
  display:flex;gap:24px;align-items:flex-start;
}
.page-main{flex:1;min-width:0}

.org-chart-wrap{
  background:#fff;border:1px solid #e0e0e0;margin-bottom:24px;
}
.org-chart-head{
  background:#012c49;color:#fff;padding:12px 18px;
  font-size:14px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;
}
.org-tree{padding:0}
.org-level{
  background:#f0f4f8;padding:9px 18px;
  font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:#012c49;text-transform:uppercase;
  border-bottom:1px solid #e0e0e0;
}
.org-node{
  display:block;padding:11px 18px;text-decoration:none;
  color:#333;font-size:14px;border-bottom:1px solid #f0f0f0;
  cursor:pointer;transition:all .15s;
  border-left:3px solid transparent;
}
.org-node:hover{background:#f8f9fa;border-left-color:#c0392b}
.org-node.active{background:#fdf1f1;border-left-color:#c0392b;color:#c0392b;font-weight:700}
.org-node .en{font-size:12px;color:#888;margin-left:6px;font-weight:400}
.org-node .desc{display:block;font-size:12px;color:#888;margin-top:2px}

.dept-panel{
  border:1px solid #e0e0e0;background:#fff;padding:26px 30px;
}
.dept-tag{
  display:inline-block;background:#012c49;color:#fff;
  font-size:11px;letter-spacing:2px;padding:4px 12px;
  text-transform:uppercase;margin-bottom:14px;
}
.dept-title{font-size:23px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.dept-sub{
  font-size:13px;color:#888;font-style:italic;
  font-family:Georgia,serif;margin-bottom:16px;
}
.dept-chief{
  display:inline-block;background:#f8f9fa;border:1px solid #e0e0e0;
  padding:8px 16px;font-size:13px;color:#555;margin-bottom:20px;
}
.dept-chief b{color:#1a1a1a}

.dept-section{margin-bottom:22px}
.dept-section h3{
  font-size:14px;color:#012c49;letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:12px;
  padding-bottom:6px;border-bottom:2px solid #c0392b;
  display:inline-block;
}
.dept-section p{font-size:14px;color:#444;line-height:1.8;margin-bottom:10px}
.dept-section ul{list-style:none;padding:0}
.dept-section li{
  padding:8px 0 8px 20px;position:relative;font-size:14px;color:#444;
  border-bottom:1px solid #f0f0f0;
}
.dept-section li:last-child{border-bottom:none}
.dept-section li:before{
  content:'';position:absolute;left:0;top:14px;
  width:8px;height:8px;background:#c0392b;
}
.dept-section li b{color:#1a1a1a}

/* === LSPD 统一页脚 === */
.site-footer{
  margin-top:30px;padding:26px 20px;text-align:center;
  background:linear-gradient(180deg,#ffffff 0%,#f0f4f8 100%);
  border-top:2px solid #012c49;
}
.site-footer-inner{
  display:flex;align-items:center;justify-content:center;gap:12px;
  flex-wrap:wrap;
}
.site-footer img{height:42px;width:42px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(26,58,92,.3))}
.site-footer .foot-brand{
  font-family:Georgia,'Times New Roman',serif;font-style:italic;
  font-size:16px;letter-spacing:2px;color:#012c49;font-weight:700;
}
.site-footer .foot-tag{font-size:11px;color:#5a7a9c;letter-spacing:1px}

/* === 响应式 === */
@media(max-width:960px){
  .page-wrap{flex-direction:column}
  .dept-panel{padding:20px}
}
@media(max-width:600px){
  .header-title .motto{display:none}
  .page-h1{font-size:21px}
}
</style>
</head>

<body>

<!-- LSPD 统一顶栏 -->
<div class="header">
  <div class="header-top">
    <div class="logo-box">
      <img src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/badges/lspd_badge.png" alt="LSPD" title="Los Santos Police Department">
    </div>
    <div class="header-title">
      <h1>Los Santos Police Department</h1>
      <div class="motto">"To Protect and to Serve"</div>
    </div>
    <a class="home-btn" href="/" title="返回首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>返回首页</span>
    </a>
  </div>
</div>

<!-- 页面标题区 -->
<div class="page-head">
  <h1 class="page-h1">LSPD 组织架构</h1>
  <div class="page-h1-sub">点击左侧部门名称，查看详细部门介绍</div>
</div>

<!-- 中间主体：组织列表 + 详情面板 -->
<div class="page-wrap">
  <div class="org-chart-wrap" style="width:340px;flex-shrink:0;margin-bottom:0">
    <div class="org-chart-head">LSPD Organization Chart</div>
    <div class="org-tree" id="org-tree"></div>
  </div>

  <div class="dept-panel" id="dept-panel" style="flex:1;min-width:0">
    <div class="dept-tag" id="d-tag">DEPARTMENT PROFILE</div>
    <div class="dept-title" id="d-title">Patrol Division</div>
    <div class="dept-sub" id="d-sub">洛圣都警察局下属部门</div>
    <div class="dept-chief" id="d-chief">主管：<b>待定</b></div>
    <div id="d-body"></div>
  </div>
</div>

<!-- LSPD 统一页脚 -->
<footer class="site-footer">
  <div class="site-footer-inner">
    <img src="https://6272-bryant-d6g0lr5jrd4c95f00-1468635164.tcb.qcloud.la/badges/lspd_badge.png" alt="LSPD">
    <span class="foot-brand">by Bradford</span>
    <span class="foot-tag">LSPD MDT &middot; To Protect and to Serve</span>
  </div>
</footer>

<script>
(function(){
  var TREE = [
    {
      level: 'Office of the Chief of Police',
      levelCn: '局长办公室',
      items: [
        { key: 'chief', name: 'Chief of Police', cn: '局长', desc: '查看局长致辞' }
      ]
    },
    {
      level: 'Operations Bureau',
      levelCn: '行动局',
      items: [
        { key: 'patrol', name: 'Patrol Division', cn: '巡逻部', desc: '城市巡逻 · 一线响应' },
        { key: 'traffic', name: 'Traffic Division', cn: '交通部', desc: '道路执法 · 事故处置' }
      ]
    },
    {
      level: 'Detective Bureau',
      levelCn: '调查局',
      items: [
        { key: 'detective', name: 'Detective Division', cn: '侦探局', desc: '重大案件 · 刑事侦查' }
      ]
    },
    {
      level: 'Special Operations Bureau',
      levelCn: '特勤行动局',
      items: [
        { key: 'swat', name: 'SWAT', cn: '特警队', desc: '高危战术 · 人质救援' },
        { key: 'air', name: 'Air Support Division', cn: '空中支援', desc: '直升机巡逻 · 空中追缉' }
      ]
    }
  ];

  var DEPTS = {
    chief: {
      tag: 'OFFICE OF THE CHIEF',
      title: 'Office of the Chief of Police',
      sub: '部门指挥核心',
      chief: { role: 'Chief of Police', name: 'Jacob Hood' },
      intro: '局长办公室是洛圣都警察局的最高决策与执行核心，直接向警察委员会汇报，负责战略规划、政策落实与跨部门协调。',
      sections: [
        {
          h: '核心使命与职责',
          items: [
            { b: '战略领导', t: '制定部门长期目标，强调社区警务与技术整合，并监督各部门执行。' },
            { b: '政策落实', t: '执行警察委员会通过的决议。' },
            { b: '跨部门协调', t: '整合行动局、调查局与特勤行动局的资源。' },
            { b: '公众信任建设', t: '通过社区论坛与公开报告（如年度武力使用报告）提升透明度。' }
          ]
        },
        {
          h: '高层管理架构',
          items: [
            { b: '局长（雅各布·胡德）', t: '统筹全局，直接向警察委员会汇报，负责重大决策。' },
            { b: '助理局长', t: '暂无任命。职责包括协调内务、政策落实与危机响应。' }
          ]
        },
        {
          h: '直属部门',
          items: [
            { b: '行政管理', t: '负责局长日常文件、日程与会议协调；管理部门印章、档案及机密信息，确保行政合规。' },
            { b: '社区关系科', t: '设计社区参与项目，促进警民合作，监测社区舆情。' }
          ]
        },
        {
          h: '跨部门协作',
          items: [
            { b: '警察委员会联络', t: '局长每月向委员会提交报告（如 2025 年警力扩充可行性报告）；委员会通过审计与政策建议监督办公室运作。' },
            { b: '职业标准协调', t: '局长办公室制定政策（如《警员行为规范》），职业标准科负责具体调查；特别事务办公室与内务部（IAD）协作。' }
          ]
        },
        {
          h: '最新改革',
          items: [
            { b: 'LSPD 警察局长咨询委员会', t: '收集整理警员反馈与建议，采纳合理意见并落实。' }
          ]
        }
      ],
      summary: '洛圣都警察局局长办公室通过战略领导、跨部门协作与社区参与，在公共安全与执法公信力之间取得平衡。其 2025 年改革聚焦效率提升与透明度增强，如优化内部流程、扩大技术应用，为其他警局提供了治理范本。展望未来，办公室需持续应对资源压力与体系性改革挑战，确保部门始终响应洛圣都社区的多元需求。'
    },
    patrol: {
      tag: 'PATROL DIVISION',
      title: 'Patrol Division',
      sub: '洛圣都警察局下属部门',
      chief: '待定',
      intro: '巡逻部是洛圣都警察局的门面与中坚力量，负责全市日常巡逻与一线响应。巡逻警员是市民接触警察的第一人，也是城市安全最基础、最直接的保障。',
      sections: [
        {
          h: '主要职责',
          items: [
            { t: '覆盖洛圣都全部辖区的日常城市巡逻' },
            { t: '紧急报警的一线响应，处置各类事件' },
            { t: '交通拦停、行人盘查与可疑车辆检查' },
            { t: '大型活动与公众集会的秩序维护' },
            { t: '为侦查单位提供一线支援与情报' }
          ]
        }
      ]
    },
    traffic: {
      tag: 'TRAFFIC DIVISION',
      title: 'Traffic Division',
      sub: '洛圣都警察局下属部门',
      chief: '待定',
      intro: '交通部负责洛圣都的道路安全。从日常道路巡逻到重大交通事故的现场处置，警员专注于维护城市交通秩序。',
      sections: [
        {
          h: '主要职责',
          items: [
            { t: '城市道路巡逻与交通违法查处' },
            { t: '交通事故现场处置与责任认定' },
            { t: '酒驾与毒驾检查及执法' },
            { t: '追缉行动中的道路拦截配合' },
            { t: '大型活动期间的交通管控与疏导' }
          ]
        }
      ]
    },
    detective: {
      tag: 'DETECTIVE BUREAU',
      title: 'Detective Division',
      sub: '洛圣都警察局下属部门',
      chief: '待定',
      intro: '侦探局是洛圣都警察局的刑事侦查核心，负责侦破全市重大刑事案件。侦探不穿制服，却以另一种方式守护这座城市——现场取证、线索分析与嫌犯审讯。',
      sections: [
        {
          h: '主要职责',
          items: [
            { t: '侦办凶杀、抢劫等重大刑事案件' },
            { t: '现场勘查与物证采集、分析' },
            { t: '跟踪监控、线索分析与嫌犯审讯' },
            { t: '卧底行动与有组织犯罪调查' },
            { t: '与各区巡逻部门协作侦破案件' }
          ]
        }
      ]
    },
    swat: {
      tag: 'SWAT',
      title: 'SWAT',
      sub: '特殊武器与战术',
      chief: '待定',
      intro: 'SWAT（特警队）是洛圣都警察局的高危战术单位，专门处置常规警力无法应对的极端危险情况。特警队员经过高强度战术训练，配备标准化战术装备，是城市面临最严峻威胁时的最后防线。',
      sections: [
        {
          h: '主要职责',
          items: [
            { t: '武装嫌犯等高危目标的逮捕行动' },
            { t: '人质事件中的谈判与救援' },
            { t: '重要人物的安保任务' },
            { t: '大规模骚乱与群体性事件处置' },
            { t: '高危区域的强攻与清剿行动' }
          ]
        }
      ]
    },
    air: {
      tag: 'AIR SUPPORT',
      title: 'Air Support Division',
      sub: '洛圣都警察局下属部门',
      chief: '待定',
      intro: '空中支援是洛圣都警察局的空中力量，装备警用直升机，为地面单位提供不可替代的空中视角。在追缉、搜救与大型活动安保中，空中警员是地面行动的「空中之眼」，掌握整个区域的态势。',
      sections: [
        {
          h: '主要职责',
          items: [
            { t: '追缉行动中的空中监控与指挥' },
            { t: '失踪人员与嫌犯的空中搜索' },
            { t: '大型活动的空中巡逻与安保' },
            { t: '城市突发事件的快速空中支援' },
            { t: '航拍取证，协助案件侦查' }
          ]
        }
      ]
    }
  };

  // 渲染左侧树
  var treeHtml = '';
  TREE.forEach(function(group){
    treeHtml += '<div class="org-level">' + group.level + '<span style="margin-left:8px;color:#888;font-weight:400">' + group.levelCn + '</span></div>';
    group.items.forEach(function(item){
      treeHtml += '<a class="org-node" data-dept="' + item.key + '">' +
        item.name + '<span class="en">' + item.cn + '</span>' +
        '<span class="desc">' + item.desc + '</span></a>';
    });
  });
  document.getElementById('org-tree').innerHTML = treeHtml;

  // 渲染详情
  function render(key){
    var d = DEPTS[key];
    if (!d) return;
    document.getElementById('d-tag').textContent = d.tag || 'DEPARTMENT PROFILE';
    document.getElementById('d-title').textContent = d.title;
    document.getElementById('d-sub').textContent = d.sub || '洛圣都警察局下属部门';
    if (typeof d.chief === 'object') {
      document.getElementById('d-chief').innerHTML = d.chief.role + ': <b>' + d.chief.name + '</b>';
    } else {
      document.getElementById('d-chief').innerHTML = '主管：<b>' + d.chief + '</b>';
    }

    var html = '';
    if (d.intro) html += '<div class="dept-section"><p>' + d.intro + '</p></div>';
    (d.sections || []).forEach(function(s){
      html += '<div class="dept-section"><h3>' + s.h + '</h3><ul>';
      s.items.forEach(function(it){
        html += '<li>';
        if (it.b) html += '<b>' + it.b + '</b>' + (it.t ? ' — ' : '');
        if (it.t) html += it.t;
        html += '</li>';
      });
      html += '</ul></div>';
    });
    if (d.summary) html += '<div class="dept-section"><h3>总结</h3><p>' + d.summary + '</p></div>';
    document.getElementById('d-body').innerHTML = html;

    document.querySelectorAll('.org-node').forEach(function(el){
      el.classList.toggle('active', el.getAttribute('data-dept') === key);
    });
  }

  document.querySelectorAll('.org-node').forEach(function(el){
    el.addEventListener('click', function(e){
      e.preventDefault();
      render(el.getAttribute('data-dept'));
    });
  });

  render('chief');
})();
</script>
</body>
</html>
